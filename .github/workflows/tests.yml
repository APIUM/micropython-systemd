name: tests

on:
  push:
  pull_request:

env:
  MICROPYTHON_VERSION: v1.24.1

jobs:
  cpython:
    name: CPython ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python tests/run_tests.py

      - name: Import from an installed layout
        run: |
          mkdir -p "$RUNNER_TEMP/lib"
          cp -r mpsystemd "$RUNNER_TEMP/lib/mpsystemd"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/lib" python "$GITHUB_WORKSPACE/tests/smoke_installed.py"

      - name: Integration tests against systemd
        run: sudo -E MPSYSTEMD_IT_SCOPE=system "$(which python)" tests/integration/run_integration.py

      - name: Build the wheel
        run: |
          python -m pip install --upgrade build
          python -m build

  micropython:
    name: MicroPython unix port
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: micropython-systemd

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev pkg-config git

      - uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: ${{ env.MICROPYTHON_VERSION }}
          path: micropython

      - name: Build mpy-cross and the unix port
        working-directory: micropython
        run: |
          make -C mpy-cross -j"$(nproc)"
          make -C ports/unix submodules
          make -C ports/unix -j"$(nproc)"
          ./ports/unix/build-standard/micropython -c 'import ffi, uctypes; print("ffi and uctypes present")'

      - name: Install the optional logging module
        working-directory: micropython-systemd
        run: |
          mkdir -p .mplib
          ../micropython/ports/unix/build-standard/micropython -m mip install --target .mplib logging

      - name: Unit tests
        working-directory: micropython-systemd
        env:
          MICROPYPATH: .frozen:.mplib:.:tests
        run: ../micropython/ports/unix/build-standard/micropython tests/run_tests.py

      - name: Import from an installed layout
        working-directory: micropython-systemd
        run: |
          mkdir -p "$RUNNER_TEMP/lib"
          cp -r mpsystemd "$RUNNER_TEMP/lib/mpsystemd"
          cd "$RUNNER_TEMP"
          MICROPYPATH=".frozen:$RUNNER_TEMP/lib" \
            "$GITHUB_WORKSPACE/micropython/ports/unix/build-standard/micropython" \
            "$GITHUB_WORKSPACE/micropython-systemd/tests/smoke_installed.py"

      - name: Integration tests against systemd
        working-directory: micropython-systemd
        run: |
          sudo -E MPSYSTEMD_IT_SCOPE=system python3 tests/integration/run_integration.py \
            "$PWD/../micropython/ports/unix/build-standard/micropython"
